{% extends "admin_base.html" %} 
{% load static %}
{%block content%}

<style>
    body{
            background-color:  #141B2D;
            color:white;
        }
</style>
   <div class="container">
    <h2 class="mb-4">
        <i class="fas fa-chalkboard"></i> Manage Classes
    </h2>
    {% if messages %}
    {% for m in messages %}
        <div class="alert alert-{{ m.tags }} alert-dismissible fade show">
            {{ m }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    {% endfor %}
    {% endif %}
   
    <table class="table table-bordered">
        <thead class="table-dark">
            <tr>
                <th>S.no.</th>
                <th>Title</th>
                <th>About</th>
                <th>Action</th>
            
            </tr>
        </thead>
        <tbody>
            {% for c in notice%}
            <tr>
                <td>{{forloop.counter}}</td>
                <td>{{c.notice}}</td>
                <td>{{c.detail}}</td>
                <td>
                    <a href="{% url 'edit_class' c.id %}" class="btn btn-info btn-sm"><i class="fa-regular fa-pen-to-square"></i> Edit</a>
                     <a href="?delete={{c.id}}" class="btn btn-danger btn-sm"><i class="fa-solid fa-delete-left"></i> Delete</a>
                </td>
            </tr>
            {%endfor%}
        </tbody>
    </table>
        
   </div>
   {% endblock %}
