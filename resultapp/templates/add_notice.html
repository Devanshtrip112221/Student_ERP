 {% extends "admin_base.html" %} 
{% load static %}
   {%block content%}
   <div class="container">
    <h2 class="mb-4">
        <i class="fas fa-plus-circle"></i> Notice
    </h2>
    {% if messages %}
    {% for m in messages %}
        <div class="alert alert-{{ m.tags }} alert-dismissible fade show">
            {{ m }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    {% endfor %}
{% endif %}
   <form method="post">
    {% csrf_token %}
    <style>
    body{
            background-color:  #141B2D;
            color:white;
        }
</style>
    
    <div class="mb-3">
        <label for="title" class="form-label">Title</label>
        <input type="text" class="form-control" id="title" name="title" required>
    </div>
     <div class="mb-3">
    <label for="details" class="form-label">Important</label>
    <textarea type="text" class="form-control" id="details" name="details">
    </textarea>
</div>

<button type="submit" class="btn btn-success">
    <i class="fas fa-check-circle me-1"></i>Submit
</button>

</form>
   </div>
    {%endblock %}
